Lumina:
  card-mod-theme: Lumina

  # Page background: soft colour glows on a deep navy base. The glass only reads as
  # glass with something colourful behind it, so keep this unless you replace it.
  lovelace-background: >-
    radial-gradient(1200px 600px at 12% 10%, rgba(180,60,230,0.32) 0%, transparent 55%),
    radial-gradient(1000px 700px at 88% 20%, rgba(40,140,255,0.30) 0%, transparent 55%),
    radial-gradient(1400px 800px at 75% 85%, rgba(255,60,140,0.25) 0%, transparent 60%),
    radial-gradient(1000px 700px at 10% 90%, rgba(60,220,220,0.22) 0%, transparent 55%),
    linear-gradient(160deg, #0a0817 0%, #120f28 50%, #07122a 100%)

  # Design tokens
  # Concentric corners: an inner shape's radius is the card's minus the gap between them
  lumina-card-radius: 20px
  lumina-icon-radius: 14px        # 44px icon in a 56px card: 6px in
  lumina-sub-button-radius: 10px  # 36px sub-button in a 56px card: 10px in
  lumina-card-background: rgba(255,255,255,0.05)
  lumina-icon-background: rgba(255,255,255,0.07)
  lumina-border: 1px solid rgba(255,255,255,0.10)
  lumina-card-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08)
  lumina-name-color: rgba(255,255,255,0.82)
  lumina-state-color: rgba(255,255,255,0.35)
  lumina-icon-color: rgba(255,255,255,0.55)
  lumina-card-blur: blur(20px)
  lumina-slider-fill: rgba(0,0,0,0.20)
  lumina-transition: all 0.35s ease
  lumina-disabled-opacity: 0.35
  # Glow/shadow building blocks, so the glow system can follow the mode
  lumina-ink: 255,255,255          # r,g,b of text and line tints: white on dark, navy on light
  lumina-shadow-rgb: 0,0,0
  lumina-shadow-alpha: 0.25        # card drop shadow strength
  lumina-glow-base: 0.05           # glass tint under a card that is not glowing
  lumina-highlight: 0.08           # inset top highlight strength
  lumina-menu-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.12)

  # Glass panels: a stack-in-card with card_mod class "glass" (or "glass-inner" inside one)
  lumina-glass-background: rgba(255,255,255,0.04)
  lumina-glass-blur: blur(30px) saturate(180%)
  lumina-glass-radius: 28px
  lumina-glass-shadow: 0 12px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18)
  lumina-glass-padding: 14px
  lumina-glass-inner-padding: 8px

  # Palette: r,g,b triplets, used as rgba(var(--lumina-green), 0.3) or as a --glow value
  lumina-amber: 255,180,50
  lumina-green: 80,200,140
  lumina-teal: 45,212,191
  lumina-cyan: 56,189,248
  lumina-blue: 100,180,255
  lumina-indigo: 99,102,241
  lumina-red: 220,80,80
  lumina-magenta: 226,0,116

  # Section titles (Bubble separators)
  lumina-separator-line: linear-gradient(90deg, rgba(255,255,255,0.18), transparent)
  lumina-separator-icon-color: rgba(255,255,255,0.45)
  # Untitled dividers between rows: faint at the ends, brightest in the middle
  lumina-divider: linear-gradient(90deg, transparent, rgba(255,255,255,0.07) 18%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0.07) 82%, transparent)

  # Bubble Card defaults (per-card styles still override these)
  bubble-border-radius: var(--lumina-card-radius)
  bubble-icon-border-radius: var(--lumina-icon-radius)
  bubble-sub-button-border-radius: var(--lumina-sub-button-radius)
  # Button cards only, so separators and other card types keep their look
  bubble-button-main-background-color: var(--lumina-card-background)
  bubble-button-border: var(--lumina-border)
  bubble-button-box-shadow: var(--lumina-card-shadow)
  bubble-button-icon-background-color: var(--lumina-icon-background)
  # Select cards: same look as buttons
  bubble-select-main-background-color: var(--lumina-card-background)
  bubble-select-border: var(--lumina-border)
  bubble-select-box-shadow: var(--lumina-card-shadow)
  bubble-select-icon-background-color: var(--lumina-icon-background)
  bubble-select-arrow-background-color: var(--lumina-icon-background)
  bubble-select-button-border-radius: var(--lumina-sub-button-radius)
  # Climate, cover, media player and calendar cards: same glass as buttons
  # (Bubble reads --bubble-<card_type>-*; the generic --bubble-* ones would also restyle pop-ups)
  bubble-climate-main-background-color: var(--lumina-card-background)
  bubble-climate-border: var(--lumina-border)
  bubble-climate-box-shadow: var(--lumina-card-shadow)
  bubble-climate-icon-background-color: var(--lumina-icon-background)
  bubble-climate-button-background-color: var(--lumina-icon-background)
  bubble-cover-main-background-color: var(--lumina-card-background)
  bubble-cover-border: var(--lumina-border)
  bubble-cover-box-shadow: var(--lumina-card-shadow)
  bubble-cover-icon-background-color: var(--lumina-icon-background)
  bubble-media-player-main-background-color: var(--lumina-card-background)
  bubble-media-player-border: var(--lumina-border)
  bubble-media-player-box-shadow: var(--lumina-card-shadow)
  bubble-media-player-icon-background-color: var(--lumina-icon-background)
  bubble-calendar-main-background-color: var(--lumina-card-background)
  bubble-calendar-border: var(--lumina-border)
  bubble-calendar-box-shadow: var(--lumina-card-shadow)
  # Every dropdown menu (select cards and select sub-buttons)
  bubble-select-list-background-color: rgba(18,15,40,0.92)
  bubble-select-list-item-accent-color: rgba(255,255,255,0.10)
  bubble-select-list-border-radius: var(--lumina-card-radius)
  # Behind an open pop-up: the page's own deep navy, dimmed
  bubble-backdrop-background-color: rgba(10,8,23,0.6)

  # Every other card (graphs, entities, weather, ...): the same glass as Bubble buttons
  # (Their glass background is set in card-mod-card, not as ha-card-background: Bubble Card builds
  # pop-ups and their backdrop from ha-card-background, and the white glass tint made them white.)
  ha-card-border-color: rgba(255,255,255,0.10)
  ha-card-border-radius: var(--lumina-card-radius)
  ha-card-box-shadow: var(--lumina-card-shadow)
  # Graph lines and bars in palette order
  graph-color-1: rgb(56,189,248)
  graph-color-2: rgb(226,0,116)
  graph-color-3: rgb(255,180,50)
  graph-color-4: rgb(80,200,140)
  graph-color-5: rgb(99,102,241)
  graph-color-6: rgb(45,212,191)
  graph-color-7: rgb(220,80,80)
  graph-color-8: rgb(100,180,255)

  # State colours from the palette (thermostats, tiles and their mode buttons)
  state-inactive-color: rgba(255,255,255,0.30)
  state-climate-heat-color: rgb(255,180,50)
  state-climate-cool-color: rgb(56,189,248)
  state-water_heater-electric-color: rgb(255,180,50)
  state-water_heater-eco-color: rgb(80,200,140)
  state-water_heater-high_demand-color: rgb(220,80,80)

  # Dark is the default look (the flat keys above). Light overrides them in modes.light.
  # Pick Auto, Light or Dark as the theme mode in your profile
  modes:
    dark:
      primary-background-color: "#0a0817"
      secondary-background-color: "#120f28"
      card-background-color: "#151231"
      primary-color: rgb(56,189,248)
      accent-color: rgb(99,102,241)
    light:
      primary-background-color: "#f7f6fa"
      secondary-background-color: "#ece9f2"
      card-background-color: "#ffffff"
      primary-color: rgb(2,132,199)
      accent-color: rgb(79,70,229)

      # Same recipe as dark: a soft four-hue aurora (peach, sky, rose, mint) behind, glass in front. Glass is a faint white tint,
      # the edge a faint ink tint, one soft shadow and one top highlight. No extra layers.
      lovelace-background: >-
        radial-gradient(1200px 600px at 12% 10%, rgba(255,170,120,0.28) 0%, transparent 55%),
        radial-gradient(1000px 700px at 88% 20%, rgba(90,180,255,0.26) 0%, transparent 55%),
        radial-gradient(1400px 800px at 75% 85%, rgba(255,130,170,0.20) 0%, transparent 60%),
        radial-gradient(1000px 700px at 10% 90%, rgba(80,220,190,0.24) 0%, transparent 55%),
        linear-gradient(160deg, #fffaf6 0%, #f7f6fa 50%, #f2f7fa 100%)

      lumina-card-background: rgba(255,255,255,0.14)
      lumina-icon-background: rgba(20,32,56,0.06)
      lumina-border: 1px solid rgba(20,32,56,0.10)
      lumina-card-shadow: 0 4px 16px rgba(20,40,80,0.10), inset 0 1px 0 rgba(255,255,255,0.70)
      lumina-name-color: rgba(20,32,56,0.88)
      lumina-state-color: rgba(20,32,56,0.55)
      lumina-icon-color: rgba(20,32,56,0.60)
      lumina-slider-fill: rgba(20,32,56,0.12)
      lumina-glass-background: rgba(255,255,255,0.10)
      lumina-glass-shadow: 0 12px 40px rgba(20,40,80,0.15), inset 0 1px 0 rgba(255,255,255,0.90)

      lumina-setpoint-color: rgba(20,32,56,0.90)
      lumina-ink: 20,32,56
      lumina-shadow-rgb: 20,40,80
      lumina-shadow-alpha: 0.10
      lumina-glow-base: 0.14
      lumina-highlight: 0.70
      lumina-menu-shadow: 0 12px 40px rgba(20,40,80,0.20), inset 0 1px 0 rgba(255,255,255,0.90)

      # Palette darkened for contrast on a light background
      lumina-amber: 217,119,6
      lumina-green: 22,163,74
      lumina-teal: 13,148,136
      lumina-cyan: 2,132,199
      lumina-blue: 37,99,235
      lumina-indigo: 79,70,229
      lumina-red: 220,38,38
      lumina-magenta: 200,0,100

      lumina-separator-line: linear-gradient(90deg, rgba(20,32,56,0.22), transparent)
      lumina-separator-icon-color: rgba(20,32,56,0.50)
      lumina-divider: linear-gradient(90deg, transparent, rgba(20,32,56,0.08) 18%, rgba(20,32,56,0.30) 50%, rgba(20,32,56,0.08) 82%, transparent)

      bubble-select-list-background-color: rgba(248,250,254,0.94)
      bubble-select-list-item-accent-color: rgba(20,40,80,0.08)
      bubble-backdrop-background-color: rgba(20,32,56,0.28)

      ha-card-border-color: rgba(20,32,56,0.10)
      graph-color-1: rgb(2,132,199)
      graph-color-2: rgb(200,0,100)
      graph-color-3: rgb(217,119,6)
      graph-color-4: rgb(22,163,74)
      graph-color-5: rgb(79,70,229)
      graph-color-6: rgb(13,148,136)
      graph-color-7: rgb(220,38,38)
      graph-color-8: rgb(37,99,235)
      state-inactive-color: rgba(20,32,56,0.35)
      state-climate-heat-color: rgb(217,119,6)
      state-climate-cool-color: rgb(2,132,199)
      state-water_heater-electric-color: rgb(217,119,6)
      state-water_heater-eco-color: rgb(22,163,74)
      state-water_heater-high_demand-color: rgb(220,38,38)

  # Base look for every card. No !important on colours, so per-card
  # styles (e.g. state-based templates) keep winning.
  card-mod-card: |
    .bubble-range-slider {
      border-radius: 0 !important;
    }
    .bubble-button-card-container,
    .bubble-select-card-container,
    .bubble-climate-container,
    .bubble-cover-container,
    .bubble-media-player-container,
    .bubble-calendar-container {
      backdrop-filter: var(--lumina-card-blur) !important;
      border-radius: var(--lumina-card-radius) !important;
    }
    .bubble-icon-container {
      border-radius: var(--lumina-icon-radius) !important;
      border: var(--lumina-border);
      transition: var(--lumina-transition);
    }
    /* Equal margins, so the concentric radii hold on every side: the icon sits 6px from the
       card's left, top and bottom edges, the sub-buttons 10px from its right, top and bottom.
       (The values add the card's 1px border.) Cards with their own layout keep it. */
    .bubble-button-card-container .bubble-icon-container {
      margin-inline-start: 5px;
    }
    .bubble-button-card-container .bubble-sub-button-container {
      inset-inline-end: 9px;
    }
    /* Climate set-point: Bubble tints it with the heat/cool state colour, which can match the card's
       own state fill. --lumina-setpoint-color overrides it (unset = Bubble's default) */
    .bubble-low-temp-container,
    .bubble-high-temp-container {
      color: var(--lumina-setpoint-color, var(--state-climate-heat-color, var(--state-climate-active-color, var(--state-active-color))));
    }
    .bubble-high-temp-container {
      color: var(--lumina-setpoint-color, var(--state-climate-cool-color, var(--state-climate-active-color, var(--state-active-color))));
    }
    .bubble-name {
      font-size: 14px !important;
      font-weight: 500 !important;
      color: var(--lumina-name-color);
    }
    .bubble-state {
      font-size: 12px !important;
      color: var(--lumina-state-color);
    }

    /* Other cards: frosted like Bubble buttons (Bubble and stack-in-card draw their own) */
    :host(:not(.type-custom-bubble-card):not(.type-custom-stack-in-card)) ha-card {
      background: var(--lumina-card-background);
      backdrop-filter: var(--lumina-card-blur);
      -webkit-backdrop-filter: var(--lumina-card-blur);
    }
    /* Inside a stack-in-card (a glass panel), stack-in-card clears their background, corners and
       shadow inline. Bring the glass tile back, so e.g. Mushroom cards sit in a panel like Bubble cards */
    :host(:not(.type-custom-bubble-card):not(.type-custom-stack-in-card)) ha-card[style*="border-radius: 0px"] {
      background: var(--lumina-card-background) !important;
      border-radius: var(--lumina-card-radius) !important;
      box-shadow: var(--lumina-card-shadow) !important;
    }
    /* Their titles in the Lumina type: smaller, softer, like a card name */
    .card-header {
      font-size: 16px !important;
      font-weight: 500 !important;
      color: var(--lumina-name-color) !important;
      letter-spacing: 0.2px;
    }

    /* Section titles */
    .bubble-separator .bubble-line {
      background: var(--lumina-separator-line) !important;
      opacity: 1 !important;
      height: 1px !important;
    }
    .bubble-separator .bubble-icon {
      color: var(--lumina-separator-icon-color) !important;
      font-size: 16px !important;
    }
    .bubble-separator .bubble-name {
      color: var(--lumina-icon-color) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase !important;
    }

    /* Dropdowns: arrow button and the open menu in glass */
    .bubble-dropdown-arrow {
      border: var(--lumina-border);
      box-sizing: border-box;
      color: var(--lumina-icon-color);
    }
    ha-dropdown::part(menu) {
      backdrop-filter: var(--lumina-glass-blur) !important;
      -webkit-backdrop-filter: var(--lumina-glass-blur) !important;
      border: var(--lumina-border) !important;
      box-shadow: var(--lumina-menu-shadow) !important;
    }

    /* Glow system. A card opts in from its styles with card.classList.add('lumina-glow')
       and sets --glow (an r,g,b triplet) and --glow-on on .bubble-button-card-container.
       --glow-on: 0 off, 1 the standard glow, above 1 stronger. Optional: --glow-dim (second
       gradient colour) and --glow-icon (an icon colour, for glows too dark as icons).
       With --glow-on: 0 this is exactly the plain Lumina look. The rules are !important
       (Bubble paints light icons and fills inline) but only reach opted-in cards. */
    :host {
      --glow: var(--lumina-ink);
      --glow-on: 0;
    }
    ha-card.lumina-glow .bubble-button-card-container,
    ha-card.lumina-glow .bubble-climate-container {
      --lumina-glow-layer: linear-gradient(135deg, rgba(var(--glow), calc(var(--glow-on) * 0.20)), rgba(var(--glow-dim, var(--glow)), calc(var(--glow-on) * 0.10)));
      background: var(--lumina-glow-layer), rgba(255,255,255, calc(var(--lumina-glow-base) - var(--glow-on) * var(--lumina-glow-base))) !important;
      border: 1px solid rgba(var(--glow), calc(0.10 + var(--glow-on) * 0.30)) !important;
      box-shadow: 0 4px 16px rgba(var(--lumina-shadow-rgb), calc(var(--lumina-shadow-alpha) - var(--glow-on) * var(--lumina-shadow-alpha))), 0 8px 28px rgba(var(--glow), calc(var(--glow-on) * 0.18)), inset 0 1px 0 rgba(255,255,255, calc(var(--lumina-highlight) + var(--glow-on) * 0.10)) !important;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1) !important;
    }
    ha-card.lumina-glow .bubble-icon-container {
      background: rgba(var(--glow), calc(0.07 + var(--glow-on) * 0.05)) !important;
      border: 1px solid rgba(var(--glow), calc(0.10 + var(--glow-on) * 0.14)) !important;
      transition: all 0.35s ease !important;
    }
    ha-card.lumina-glow .bubble-icon {
      color: var(--glow-icon, rgba(var(--glow), calc(0.55 + var(--glow-on) * 0.45))) !important;
      transition: color 0.35s ease !important;
    }
    /* Switch buttons: the glow shows the state, so Bubble's solid "on" fill steps aside */
    ha-card.lumina-glow .bubble-button-background {
      background-color: transparent !important;
    }
    /* Sliders: the card glows, the fill is a quiet dark overlay */
    ha-card.lumina-glow .bubble-range-fill {
      background: var(--lumina-slider-fill) !important;
    }

    /* Disabled: a card or sub-button whose action would do nothing right now.
       Cards toggle it from their styles: card.classList.toggle('lumina-disabled', cond)
       or the same on a sub-button element. Dimmed, grey and not tappable. */
    ha-card.lumina-disabled,
    .bubble-sub-button.lumina-disabled {
      opacity: var(--lumina-disabled-opacity) !important;
      filter: grayscale(1) !important;
      pointer-events: none !important;
      transition: opacity 0.35s ease, filter 0.35s ease !important;
    }

    /* Glass panels. card-mod puts a card_mod class on the card element itself, not on its
       ha-card, so the rule matches the host: card_mod: { class: glass } on a stack-in-card. */
    :host(.glass) ha-card,
    :host(.glass-inner) ha-card {
      background: var(--lumina-glass-background) !important;
      backdrop-filter: var(--lumina-glass-blur) !important;
      -webkit-backdrop-filter: var(--lumina-glass-blur) !important;
      border: var(--lumina-border) !important;
      border-radius: var(--lumina-glass-radius) !important;
      box-shadow: var(--lumina-glass-shadow) !important;
      padding: var(--lumina-glass-padding) !important;
      overflow: hidden !important;
    }
    /* A panel inside a panel (a device inside a room): tighter, with a gap above */
    :host(.glass-inner) ha-card {
      padding: var(--lumina-glass-inner-padding) !important;
      margin-top: 8px !important;
    }

    /* Untitled divider: a Bubble separator with no name or icon and card_mod class "divider" */
    :host(.divider) .bubble-icon-container,
    :host(.divider) .bubble-name {
      display: none !important;
    }
    :host(.divider) .bubble-separator {
      height: 18px !important;
    }
    :host(.divider) .bubble-separator .bubble-line {
      flex: 1 1 auto !important;
      margin: 0 24px !important;
      height: 2px !important;
      border-radius: 1px;
      background: var(--lumina-divider) !important;
    }
